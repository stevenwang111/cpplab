<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <title>CppLab · 在线 C++ IDE</title>
    <meta name="description" content="在浏览器里编辑、编译、运行 C++，编译器本身也是 WebAssembly" />
    <script>
      // Apply the stored language before the bundle paints, so the tab title and
      // description never flash in the wrong language. Messages duplicated here
      // are the same ones src/shared/i18n/messages/common.ts ships as meta.*.
      (function () {
        var lang = null;
        try {
          var stored = localStorage.getItem('cpplab.lang');
          if (stored === 'en' || stored === 'zh-CN') lang = stored;
        } catch (error) {}
        if (!lang) lang = /^zh/i.test(navigator.language || '') ? 'zh-CN' : 'en';
        document.documentElement.lang = lang;
        document.title = lang === 'zh-CN' ? 'CppLab · 在线 C++ IDE' : 'CppLab · Online C++ IDE';
        var meta = document.querySelector('meta[name="description"]');
        if (meta) {
          meta.setAttribute(
            'content',
            lang === 'zh-CN'
              ? '在浏览器里编辑、编译、运行 C++，编译器本身也是 WebAssembly'
              : 'Edit, compile and run C++ in your browser — the compiler is WebAssembly too',
          );
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
