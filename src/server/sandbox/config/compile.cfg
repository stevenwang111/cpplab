name: "cpplab-compile"
mode: ONCE
hostname: "sandbox"
log_level: WARNING
time_limit: {{TIME_LIMIT}}
rlimit_as_type: INF
rlimit_cpu: {{CPU_SEC}}
rlimit_fsize: {{FSIZE_BYTES}}
rlimit_nofile: {{NOFILE}}
rlimit_core: 0
cgroup_mem_max: {{MEM_BYTES}}
cgroup_pids_max: {{PIDS_MAX}}
cgroup_cpu_ms_per_sec: {{CPU_MS}}
use_cgroupv2: true
keep_env: false
envar: "PATH=/usr/local/bin:/usr/bin:/bin"
envar: "HOME=/tmp"
envar: "TMPDIR=/tmp"
envar: "LANG=C"
envar: "LC_ALL=C"
envar: "TERM=dumb"

mount { dst: "/usr" src: "/usr" is_bind: true rw: false }
mount { dst: "/etc/ld.so.cache" src: "/etc/ld.so.cache" is_bind: true rw: false }
mount { dst: "/etc/ld.so.conf" src: "/etc/ld.so.conf" is_bind: true rw: false }
mount { dst: "/etc/ld.so.conf.d" src: "/etc/ld.so.conf.d" is_bind: true rw: false }
mount { dst: "/etc/localtime" src: "/etc/localtime" is_bind: true rw: false mandatory: false }
mount { dst: "/tmp" fstype: "tmpfs" rw: true options: "size={{TMPFS_MB}}m" nosuid: true nodev: true noexec: true }
mount { dst: "/dev" fstype: "tmpfs" rw: true options: "size=2m" nosuid: true noexec: true }
mount { dst: "/dev/null" src: "{{DEV_DIR}}/null" is_bind: true rw: true }
mount { dst: "/dev/zero" src: "{{DEV_DIR}}/zero" is_bind: true rw: true }
mount { dst: "/dev/urandom" src: "{{DEV_DIR}}/urandom" is_bind: true rw: true }
mount { dst: "/dev/random" src: "{{DEV_DIR}}/random" is_bind: true rw: true }
mount { dst: "/dev/fd" src: "/proc/self/fd" is_symlink: true }
mount { dst: "/dev/stdin" src: "/proc/self/fd/0" is_symlink: true }
mount { dst: "/dev/stdout" src: "/proc/self/fd/1" is_symlink: true }
mount { dst: "/dev/stderr" src: "/proc/self/fd/2" is_symlink: true }
mount { dst: "/dev/shm" fstype: "tmpfs" rw: true options: "size={{SHM_MB}}m" nosuid: true nodev: true noexec: true }
mount { dst: "/proc" fstype: "proc" rw: false }
seccomp_string: "POLICY cpplab { DENY { mount, umount, pivot_root, chroot, mount_setattr, open_tree, move_mount, fsopen, fsconfig, fsmount, fspick, unshare, setns, kexec_load, kexec_file_load, init_module, delete_module, finit_module, bpf, perf_event_open, io_uring_setup, io_uring_enter, name_to_handle_at, open_by_handle_at, reboot, swapon, swapoff, acct, settimeofday, setuid, setgid, setresuid, setresgid, capset, keyctl, add_key, request_key, userfaultfd, syslog, ioperm, iopl, ptrace } } USE cpplab DEFAULT ALLOW"
