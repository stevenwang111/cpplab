name: "cpplab-debug"
clone_newuser: false
mode: ONCE
hostname: "sandbox"
log_level: WARNING
time_limit: {{TIME_LIMIT}}
rlimit_as_type: INF
rlimit_cpu: {{CPU_SEC}}
rlimit_fsize: {{FSIZE_BYTES}}
rlimit_nofile: {{NOFILE}}
rlimit_core: 0
cgroup_mem_max: {{MEM_BYTES}}
cgroup_pids_max: {{PIDS_MAX}}
cgroup_cpu_ms_per_sec: {{CPU_MS}}
use_cgroupv2: true
keep_env: false
envar: "PATH=/usr/local/bin:/usr/bin:/bin"
envar: "HOME=/tmp"
envar: "TMPDIR=/tmp"
envar: "LANG=C"
envar: "LC_ALL=C"
envar: "TERM=dumb"

mount { dst: "/usr" src: "/usr" is_bind: true rw: false }
mount { dst: "/etc/ld.so.cache" src: "/etc/ld.so.cache" is_bind: true rw: false }
mount { dst: "/etc/ld.so.conf" src: "/etc/ld.so.conf" is_bind: true rw: false }
mount { dst: "/etc/ld.so.conf.d" src: "/etc/ld.so.conf.d" is_bind: true rw: false }
mount { dst: "/etc/localtime" src: "/etc/localtime" is_bind: true rw: false mandatory: false }
mount { dst: "/tmp" fstype: "tmpfs" rw: true options: "size={{TMPFS_MB}}m" nosuid: true nodev: true noexec: true }
mount { dst: "/dev" fstype: "tmpfs" rw: true options: "size=2m" nosuid: true noexec: true }
mount { dst: "/dev/null" src: "{{DEV_DIR}}/null" is_bind: true rw: true }
mount { dst: "/dev/zero" src: "{{DEV_DIR}}/zero" is_bind: true rw: true }
mount { dst: "/dev/urandom" src: "{{DEV_DIR}}/urandom" is_bind: true rw: true }
mount { dst: "/dev/random" src: "{{DEV_DIR}}/random" is_bind: true rw: true }
mount { dst: "/dev/pts" fstype: "devpts" rw: true options: "newinstance,ptmxmode=0666,mode=0620" nosuid: true noexec: true }
mount { dst: "/dev/ptmx" src: "/dev/pts/ptmx" is_symlink: true }
mount { dst: "/dev/fd" src: "/proc/self/fd" is_symlink: true }
mount { dst: "/dev/stdin" src: "/proc/self/fd/0" is_symlink: true }
mount { dst: "/dev/stdout" src: "/proc/self/fd/1" is_symlink: true }
mount { dst: "/dev/stderr" src: "/proc/self/fd/2" is_symlink: true }
mount { dst: "/dev/shm" fstype: "tmpfs" rw: true options: "size={{SHM_MB}}m" nosuid: true nodev: true noexec: true }
mount { dst: "/proc" fstype: "proc" rw: false }
seccomp_string: "POLICY cpplab { ALLOW { access, arch_prctl, brk, capget, chdir, chmod, chown, clock_getres, clock_gettime, clock_nanosleep, close, close_range, copy_file_range, dup, dup2, dup3, epoll_create, epoll_create1, epoll_ctl, epoll_wait, epoll_pwait, epoll_pwait2, eventfd, eventfd2, execve, execveat, exit, exit_group, faccessat, faccessat2, fadvise64, fallocate, fchdir, fchmod, fchown, fcntl, fdatasync, flock, fstatfs, fsync, ftruncate, futimesat, get_robust_list, getcpu, getcwd, getdents, getdents64, getegid, geteuid, getgid, getgroups, getpid, getpgrp, getpgid, getppid, getpriority, getrandom, getresgid, getresuid, getrlimit, getrusage, getsid, gettid, gettimeofday, getuid, inotify_add_watch, inotify_init, inotify_init1, inotify_rm_watch, ioctl, kill, lchown, link, linkat, listxattr, lseek, madvise, membarrier, mincore, mkdir, mkdirat, mlock, mlockall, mmap, mprotect, mremap, msync, munmap, munlock, munlockall, nanosleep, newfstatat, open, openat, openat2, pipe, pipe2, poll, ppoll, prctl, pread64, preadv, preadv2, prlimit64, pselect6, pwrite64, pwritev, pwritev2, read, readlink, readlinkat, readv, rename, renameat, renameat2, restart_syscall, rmdir, rseq, rt_sigaction, rt_sigpending, rt_sigprocmask, rt_sigqueueinfo, rt_sigreturn, rt_sigsuspend, rt_sigtimedwait, rt_tgsigqueueinfo, sched_getaffinity, sched_getattr, sched_getparam, sched_getscheduler, sched_rr_get_interval, sched_setaffinity, sched_setattr, sched_setparam, sched_setscheduler, sched_yield, select, set_robust_list, set_tid_address, setpriority, setrlimit, setpgid, setsid, sigaltstack, socketpair, splice, statfs, statx, symlink, symlinkat, sysinfo, tgkill, time, timer_create, timer_delete, timer_getoverrun, timer_gettime, timer_settime, timerfd_create, timerfd_gettime, timerfd_settime, times, tkill, truncate, umask, unlink, unlinkat, utime, utimensat, utimes, vfork, vmsplice, wait4, waitid, write, writev, futex, futex_waitv, shmget, shmat, shmdt, shmctl, semget, semop, semctl, semtimedop, msgget, msgsnd, msgrcv, msgctl, fork, SYSCALL[4] ON x86_64, SYSCALL[5] ON x86_64, SYSCALL[6] ON x86_64, SYSCALL[40] ON x86_64, SYSCALL[63] ON x86_64, ptrace, process_vm_readv, process_vm_writev, setuid, setgid, setresuid, setresgid, setgroups, pidfd_open, pidfd_getfd, pidfd_send_signal, memfd_create, personality }, ALLOW { clone(arg0) { (arg0 & 0x7E020000) == 0 } }, ERRNO(38) { clone3 }, ALLOW { socket(arg0) { arg0 == 1, arg0 == 16 }, connect, bind, listen, accept, accept4, sendto, sendmsg, recvfrom, recvmsg, sendmmsg, recvmmsg, shutdown, getsockname, getpeername, setsockopt, getsockopt }, ERRNO(97) { socket, connect, bind, listen, accept, accept4, sendto, sendmsg, recvfrom, recvmsg, sendmmsg, recvmmsg, shutdown, getsockname, getpeername, setsockopt, getsockopt } } USE cpplab DEFAULT KILL_PROCESS"
